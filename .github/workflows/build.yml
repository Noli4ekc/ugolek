name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-check:
    name: Compile check (simulator, debug)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4 (iOS 18.5 SDK, ControlWidget support)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode and SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -30

      - name: Diagnose ControlWidget availability
        run: |
          echo "::notice::selected: $(xcode-select -p)"
          echo "::notice::xcodebuild: $(xcodebuild -version | tr '\n' ' ')"
          echo "::notice::installed: $(ls /Applications | grep -i '^Xcode' | tr '\n' ' ')"
          echo "::notice::iphoneos sdk: $(xcrun --sdk iphoneos --show-sdk-version 2>&1)"
          cat > /tmp/cwtest.swift <<'EOF'
          import AppIntents
          import SwiftUI
          @available(iOS 18.0, *)
          struct CWTestIntent: AppIntent {
              static var title: LocalizedStringResource = "t"
              func perform() async throws -> some IntentResult { .result() }
          }
          @available(iOS 18.0, *)
          struct CWTest: ControlWidget {
              var body: some ControlWidgetConfiguration {
                  StaticControlConfiguration(kind: "diag.cw") {
                      ControlWidgetButton(action: CWTestIntent()) {
                          Label("t", systemImage: "flame.fill")
                      }
                  }
              }
          }
          EOF
          OUT=$(swiftc -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios18.0 -typecheck /tmp/cwtest.swift 2>&1 | head -4)
          if [ -z "$OUT" ]; then
            echo "::notice::RESULT: ControlWidget resolves against device SDK"
          else
            echo "::error::RESULT: $OUT"
          fi
          X26=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "::notice::testing with $X26"
          OUT26=$(DEVELOPER_DIR="$X26/Contents/Developer" swiftc \
            -sdk "$(DEVELOPER_DIR="$X26/Contents/Developer" xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios26.0 -typecheck /tmp/cwtest.swift 2>&1 | head -4)
          if [ -z "$OUT26" ]; then
            echo "::notice::RESULT26: ControlWidget resolves against Xcode 26 SDK"
          else
            echo "::error::RESULT26: $OUT26"
          fi
          SDK="$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)"
          FW="$SDK/System/Library/Frameworks"
          echo "::notice::frameworks: ${FW:-MISSING}"
          set +e
          SDKP="$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)"
          mkdir -p /tmp/sg
          for M in WidgetKit SwiftUI; do
            xcrun swift-symbolgraph-extract -sdk "$SDKP" -target arm64-apple-ios18.0 \
              -module-name "$M" -output-dir "/tmp/sg/$M" >/dev/null 2>&1
          done
          python3 - <<'PY' || true
          import json, glob
          lines = []
          for f in sorted(glob.glob('/tmp/sg/*/*.symbols.json')):
              mod = f.split('/')[-2]
              try:
                  d = json.load(open(f))
              except Exception as e:
                  print(f'::error::{mod}: {e}')
                  continue
              if not d.get('symbols'):
                  lines.append(f'[{mod}] EMPTY OR MISSING')
                  continue
              seen = set()
              for s in d.get('symbols', []):
                  title = (s.get('names') or {}).get('title', '')
                  if 'Control' in title and title not in seen:
                      seen.add(title)
                      row = '[%s] %s: %s' % (mod, s.get("kind",{}).get("displayName","?"), title)
                      lines.append(row)
                      print(f'::notice::{row}')
          with open('control_symbols.txt', 'w') as fh:
              fh.write('\n'.join(lines) + '\n')
          print(f'::notice::wrote control_symbols.txt rows={len(lines)}')
          PY
      - name: Upload symbol inventory
        uses: actions/upload-artifact@v4
        with:
          name: control-symbols
          path: control_symbols.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Never-fail marker
        if: always()
        run: exit 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        id: build
        run: |
          set -o pipefail
          xcodebuild -project Ugolek.xcodeproj \
            -scheme Ugolek \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet 2>&1 | tee buildlog.txt

      - name: Annotate compile errors
        if: failure()
        run: |
          grep -E "error:" buildlog.txt | head -40 | sed 's/^/::error::/' || true

      - name: Zip simulator .app (for Appetize.io)
        run: |
          cd dd/Build/Products/Debug-iphonesimulator
          zip -qry "${GITHUB_WORKSPACE}/Ugolek-simulator.zip" Ugolek.app

      - name: Upload simulator zip
        uses: actions/upload-artifact@v4
        with:
          name: Ugolek-simulator
          path: Ugolek-simulator.zip
          retention-days: 30

  ipa:
    name: Unsigned IPA (for AltStore)
    runs-on: macos-15
    needs: compile-check
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4 (iOS 18.5 SDK, ControlWidget support)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (device, release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Ugolek.xcodeproj \
            -scheme Ugolek \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/Ugolek.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee buildlog.txt

      - name: Annotate archive errors
        if: failure()
        run: |
          grep -E "error:" buildlog.txt | head -40 | sed 's/^/::error::/' || true

      - name: Pack unsigned IPA
        run: |
          mkdir Payload
          cp -R "build/Ugolek.xcarchive/Products/Applications/Ugolek.app" Payload/
          zip -qry Ugolek-unsigned.ipa Payload
          ls -lh Ugolek-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ugolek-unsigned-ipa
          path: Ugolek-unsigned.ipa
          retention-days: 30

  rolling-release:
    name: Attach IPA to rolling release
    runs-on: ubuntu-latest
    needs: ipa
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Ugolek-unsigned-ipa

      - name: Publish to rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rolling --repo "$GITHUB_REPOSITORY" || \
            gh release create rolling --repo "$GITHUB_REPOSITORY" \
              --title "Свежая сборка (rolling)" \
              --notes "Последняя сборка из ветки main. IPA — для установки через Sideloadly/AltStore."
          gh release upload rolling Ugolek-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"
