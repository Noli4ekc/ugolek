name: Ugolek
options:
  bundleIdPrefix: com.ugolek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  knownRegions:
    - ru
    - en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.ugolek.app
targets:
  Ugolek:
    type: application
    platform: iOS
    sources:
      - path: Ugolek
        excludes:
          - "**/UgolekControlWidget.swift"
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: UgolekWidget
    info:
      path: Ugolek/Info.plist
      properties:
        CFBundleDisplayName: Уголёк
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationAlwaysAndWhenInUseUsageDescription: "Уголёк использует геолокацию для фоновой защиты прогона рассылки — чтобы продление не обрывалось при сворачивании приложения. Координаты не собираются и не передаются."
        NSLocationAlwaysUsageDescription: "Уголёк использует геолокацию для фоновой защиты прогона рассылки — чтобы продление не обрывалось при сворачивании приложения. Координаты не собираются и не передаются."
        UIBackgroundModes:
          - processing
          - location
        BGTaskSchedulerPermittedIdentifiers:
          - com.ugolek.app.catchup
  UgolekWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Ugolek/Core/AppIntents/UgolekControlWidget.swift
      - path: Ugolek/Core/AppIntents/MaintainStreaksIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ugolek.app.widget
        IPHONEOS_DEPLOYMENT_TARGET: 18.0
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: UgolekWidget/Info.plist
      properties:
        CFBundleDisplayName: Уголёк
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Ugolek:
    build:
      targets:
        Ugolek: all
        UgolekWidget: all
    run:
      config: Debug
    archive:
      config: Release
