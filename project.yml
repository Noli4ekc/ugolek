name: Ugolek
options:
  bundleIdPrefix: com.ugolek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  knownRegions:
    - ru
    - en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.ugolek.app
targets:
  Ugolek:
    type: application
    platform: iOS
    sources:
      - path: Ugolek
        excludes:
          - "**/UgolekControlWidget.swift"
      - path: Resources
        buildPhase: resources
    info:
      path: Ugolek/Info.plist
      properties:
        CFBundleDisplayName: Уголёк
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.ugolek.app.catchup
  UgolekWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Ugolek/Core/AppIntents/UgolekControlWidget.swift
      - path: Ugolek/Core/AppIntents/MaintainStreaksIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ugolek.app.widget
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
        TARGETED_DEVICE_FAMILY[config=Debug]: "1,2"
    dependencies:
      - target: Ugolek
    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Ugolek:
    build:
      targets:
        Ugolek: all
        UgolekWidget: all
    run:
      config: Debug
    archive:
      config: Release
