name: Ugolek
options:
  bundleIdPrefix: com.ugolek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  knownRegions:
    - ru
    - en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.ugolek.app
targets:
  Ugolek:
    type: application
    platform: iOS
    sources:
      - path: Ugolek
      - path: Resources
        buildPhase: resources
    info:
      path: Ugolek/Info.plist
      properties:
        CFBundleDisplayName: Уголёк
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.ugolek.app.catchup
schemes:
  Ugolek:
    build:
      targets:
        Ugolek: all
    run:
      config: Debug
    archive:
      config: Release

